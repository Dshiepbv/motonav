name: NMAX Navi verification

on:
  push:
    branches: [feature/offline-traffic-thermal-protection]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Set version from workflow run
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"0.${{ github.run_number }}\"/" app/build.gradle.kts
      - name: Build Debug and Release
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Rename Release APK
        run: cp app/build/outputs/apk/release/app-release.apk MotoNav-0.${{ github.run_number }}.apk
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoNav-Release-0.${{ github.run_number }}
          path: MotoNav-0.${{ github.run_number }}.apk
          retention-days: 7
