name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MotoNav-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MotoNav-apk
          path: MotoNav-${{ github.run_number }}.apk

      - name: Publish release (tải APK thẳng từ điện thoại)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MotoNav bản ${{ github.run_number }}
          files: MotoNav-${{ github.run_number }}.apk
          make_latest: true
