name: Vietnam offline map

# Nền bản đồ màn xe offline cả Việt Nam: OpenStreetMap (Geofabrik) → planetiler (lược đồ OpenMapTiles, đúng như
# OpenFreeMap) → vietnam.mbtiles, đăng vào release "vn-map". Chạy tay trong tab Actions, hoặc mỗi tháng.
on:
  schedule:
    - cron: "0 19 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build vietnam.mbtiles
        run: |
          curl -sSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          java -Xmx10g -jar planetiler.jar --download --area=vietnam --maxzoom=14 --output=vietnam.mbtiles --force
          ls -la vietnam.mbtiles
      - name: Publish (release "vn-map", không thành bản mới nhất của app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vn-map >/dev/null 2>&1 || \
            gh release create vn-map --title "Bản đồ offline Việt Nam" --notes "Nền bản đồ màn xe (OpenMapTiles). © OpenStreetMap contributors (ODbL)." --latest=false
          gh release upload vn-map vietnam.mbtiles --clobber
